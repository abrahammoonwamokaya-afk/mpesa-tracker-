
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M-Pesa Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f4;font-family:Arial,sans-serif;color:#17231d}
header{background:#087c45;color:white;padding:24px 18px;border-radius:0 0 22px 22px}
header h2{margin:0 0 7px}
header p{margin:0;opacity:.85}
main{padding:16px}
.card{background:white;padding:17px;border-radius:15px;margin-bottom:14px;box-shadow:0 2px 8px #0000000a}
.balance{background:#087c45;color:white}
.amount{font-size:28px;font-weight:bold;margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.small{font-size:13px;color:#68766e}
.value{font-size:21px;font-weight:bold;margin-top:8px}
select,input{width:100%;padding:13px;border:1px solid #dce4de;border-radius:9px;margin:7px 0;font-size:15px;background:white}
button{background:#087c45;color:white;border:0;padding:14px;border-radius:9px;width:100%;font-size:16px;font-weight:bold}
.transaction{padding:13px 0;border-bottom:1px solid #eee}
.in{color:#087c45}.out{color:#d34a4a}
h3{margin-top:5px}
</style>
</head>
<body>
<header>
<h2>M-PESA TRACKER</h2>
<p>Your money. Your records. Your control.</p>
</header>
<main>
<div class="card balance">
<div>Current tracked balance</div>
<div class="amount" id="balance">KSh 0.00</div>
<div class="small" style="color:white">Based on recorded transactions</div>
</div>

<div class="card">
<b>Financial overview</b>
<select id="period" onchange="render()">
<option value="today">Today</option>
<option value="week">This week</option>
<option value="month">This month</option>
<option value="year">This year</option>
<option value="all">All time</option>
</select>
<div class="grid">
<div><div class="small">Money received</div><div class="value in" id="received">KSh 0</div></div>
<div><div class="small">Money sent</div><div class="value out" id="sent">KSh 0</div></div>
</div>
</div>

<div class="card">
<h3>Add transaction</h3>
<input id="amount" type="number" placeholder="Amount in KSh">
<select id="type">
<option value="in">Money received</option>
<option value="out">Money sent</option>
</select>
<input id="person" placeholder="Person or business name">
<input id="phone" placeholder="Phone number (optional)">
<input id="reference" placeholder="M-Pesa transaction code (optional)">
<input id="date" type="datetime-local">
<button onclick="addTransaction()">Save transaction</button>
</div>

<div class="card">
<h3>Transaction history</h3>
<div id="history">No transactions recorded yet.</div>
</div>
</main>

<script>
let transactions=JSON.parse(localStorage.getItem("mpesaRecords")||"[]");

function addTransaction(){
let amount=Number(document.getElementById("amount").value);
let person=document.getElementById("person").value.trim();
let date=document.getElementById("date").value;
if(!amount||amount<=0||!date){
alert("Enter a valid amount and date");
return;
}
transactions.unshift({
amount,
type:document.getElementById("type").value,
person:person||"Unknown",
phone:document.getElementById("phone").value,
reference:document.getElementById("reference").value,
date:new Date(date).toISOString()
});
localStorage.setItem("mpesaRecords",JSON.stringify(transactions));
["amount","person","phone","reference"].forEach(id=>document.getElementById(id).value="");
render();
}

function render(){
let now=new Date();
let period=document.getElementById("period").value;
let filtered=transactions.filter(t=>{
let d=new Date(t.date);
if(period==="today")return d.toDateString()===now.toDateString();
if(period==="week"){
let start=new Date(now);
start.setDate(now.getDate()-((now.getDay()+6)%7));
start.setHours(0,0,0,0);
return d>=start;
}
if(period==="month")return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();
if(period==="year")return d.getFullYear()===now.getFullYear();
return true;
});
let received=filtered.filter(t=>t.type==="in").reduce((s,t)=>s+t.amount,0);
let sent=filtered.filter(t=>t.type==="out").reduce((s,t)=>s+t.amount,0);
let totalIn=transactions.filter(t=>t.type==="in").reduce((s,t)=>s+t.amount,0);
let totalOut=transactions.filter(t=>t.type==="out").reduce((s,t)=>s+t.amount,0);
document.getElementById("received").textContent="KSh "+received.toLocaleString();
document.getElementById("sent").textContent="KSh "+sent.toLocaleString();
document.getElementById("balance").textContent="KSh "+(totalIn-totalOut).toLocaleString();
document.getElementById("history").innerHTML=filtered.length?filtered.map(t=>`
<div class="transaction">
<b>${t.person}</b>
<div class="${t.type}">${t.type==="in"?"+":"-"} KSh ${t.amount.toLocaleString()}</div>
<div class="small">${new Date(t.date).toLocaleString()}</div>
<div class="small">${t.reference||""} ${t.phone||""}</div>
</div>`).join(""):"No transactions for this period.";
}
render();
</script>
</body>
</html>
