<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M-Pesa <!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M-Pesa Tracker</title>
<style>
body{font-family:Arial;background:#f2f2f2;padding:15px}
.box{background:white;padding:15px;border-radius:12px;max-width:450px;margin:auto;box-shadow:0 2px 10px #ccc}
h2{color:#4CAF50;text-align:center}
input,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #ccc;font-size:16px;box-sizing:border-box}
button{background:#4CAF50;color:white;border:none;font-weight:bold}
.item{background:#f9f9f9;padding:10px;border-radius:8px;margin-top:8px;display:flex;justify-content:space-between}
.del{background:#ff4444;padding:5px 10px;width:auto}
.small{font-size:13px;color:#666}
</style>
</head>
<body>
<div class="box">
<h2>💰 M-Pesa Tracker</h2>
<p><b>Paste M-Pesa SMS here:</b></p>
<textarea id="sms" rows="3" placeholder="Paste your M-Pesa SMS here... e.g. Ksh500 sent to Mama Mboga"></textarea>
<button onclick="parseSMS()">🔍 Read SMS & Fill Below</button>

<p><b>Or type manually:</b></p>
<input id="name" placeholder="Who / What for? e.g. Mama Mboga">
<input id="amount" type="number" placeholder="Amount e.g. 500">
<input id="code" placeholder="M-Pesa Code (optional)">
<button onclick="addTx()">+ Add Transaction</button>

<h3>Total: Ksh <span id="total">0</span></h3>
<div id="list"></div>
<button onclick="clearAll()" style="background:#999">Clear All</button>
</div>

<script>
let txs = JSON.parse(localStorage.getItem('mpesa')||'[]');
function save(){ localStorage.setItem('mpesa', JSON.stringify(txs)); render(); }
function render(){
  let t=0; let h='';
  txs.forEach((x,i)=>{
    t+=Number(x.amount);
    h+=`<div class="item"><div><b>${x.name}</b><br><span class="small">${x.code||''} • ${x.date}</span></div><div><b>Ksh ${x.amount}</b><br><button class="del" onclick="delTx(${i})">X</button></div></div>`;
  });
  document.getElementById('list').innerHTML=h;
  document.getElementById('total').innerText=t.toLocaleString();
}
function addTx(){
  let name=document.getElementById('name').value.trim();
  let amount=document.getElementById('amount').value;
  let code=document.getElementById('code').value.trim().toUpperCase();
  if(!name||!amount){alert('Fill name and amount');return;}
  txs.unshift({name,amount,code,date:new Date().toLocaleDateString()});
  document.getElementById('name').value='';document.getElementById('amount').value='';document.getElementById('code').value='';
  save();
}
function delTx(i){ txs.splice(i,1); save(); }
function clearAll(){ if(confirm('Clear all?')){txs=[];save();} }
function parseSMS(){
  let sms=document.getElementById('sms').value;
  if(!sms){alert('Paste SMS first');return;}
  // Amount: Ksh500.00 or KES 500
  let amt = sms.match(/(?:Ksh|KES)\s?([\d,]+\.?\d*)/i);
  // Code: 10-char code at start like QK123ABC45
  let code = sms.match(/\b([A-Z0-9]{10})\b/);
  // Name: sent to X, received from X, paid to X, to X
  let nameMatch = sms.match(/(?:sent to|received from|paid to|to)\s+([A-Za-z0-9 .'-]+?)(?:\s+on\s|\s+\d|\.|,|$)/i);
  if(amt) document.getElementById('amount').value = amt[1].replace(/,/g,'');
  if(code) document.getElementById('code').value = code[1];
  if(nameMatch) document.getElementById('name').value = nameMatch[1].trim();
  else document.getElementById('name').value = 'M-Pesa';
  alert('Found it! Check below and tap Add Transaction');
  document.getElementById('sms').value='';
}
render();
</script>
</body>
</html>
<style>
body{font-family:sans-serif;padding:15px;background:#f2f2f2}
h1{color:#4CAF50}
.card{background:white;padding:15px;border-radius:10px;margin-bottom:10px}
input,button{width:100%;padding:10px;margin:5px 0;border-radius:8px;border:1px solid #ccc}
button{background:#4CAF50;color:white;border:none;font-weight:bold}
</style>
</head>
<body>
<h1>M-Pesa Tracker</h1>
<div class="card">
<h3 id="total">Total: Ksh 0</h3>
<input id="name" placeholder="e.g. Sent to Mama Mboga">
<input id="amount" type="number" placeholder="Amount e.g. 500">
<button onclick="add()">Add Transaction</button>
</div>
<div id="list"></div>
<script>
let total=0;
function add(){
let n=document.getElementById('name').value;
let a=Number(document.getElementById('amount').value);
if(!n||!a) return alert('Fill both');
total+=a;
document.getElementById('total').innerText='Total: Ksh '+total;
let d=document.createElement('div');
d.className='card'; d.innerText=n+' - Ksh '+a;
document.getElementById('list').prepend(d);
document.getElementById('name').value='';
document.getElementById('amount').value='';
}
</script>
</body>
</html>
